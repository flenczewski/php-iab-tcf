name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        dependencies: ['highest']
        include:
          - php-version: '8.1'
            dependencies: 'lowest'
    name: PHP ${{ matrix.php-version }} (${{ matrix.dependencies }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      # Not `composer test`: tools/test.sh falls back to Docker for machines
      # missing the PHP extensions, which is wrong (and slow) inside CI.
      - name: Run tests
        run: vendor/bin/phpunit --no-coverage

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, xml, xmlwriter
          coverage: pcov

      - uses: ramsey/composer-install@v3

      - name: Tests with coverage
        run: vendor/bin/phpunit --coverage-clover=coverage.xml

      # The suite covers 99.7% of src/; the only uncovered lines are two
      # deliberately unreachable guards, each commented as such. A drop below
      # this floor means a real branch stopped being exercised.
      - name: Enforce coverage floor
        run: |
          php -r '
            $x = simplexml_load_file("coverage.xml");
            $m = $x->project->metrics;
            $pct = 100 * (int) $m["coveredstatements"] / (int) $m["statements"];
            printf("line coverage: %.2f%%\n", $pct);
            if ($pct < 95.0) { fwrite(STDERR, "below the 95% floor\n"); exit(1); }
          '

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Coding standards
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1
